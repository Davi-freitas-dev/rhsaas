upstream rhsaas_demo_gunicorn {
    server 127.0.0.1:8002;
}

# Restaurar o IP original somente quando a conexao vier de uma faixa oficial
# da Cloudflare. Atualizar a lista a partir de https://www.cloudflare.com/ips/.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

limit_req_zone $binary_remote_addr zone=rhsaas_demo_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=rhsaas_demo_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=rhsaas_demo_sensitive:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=rhsaas_demo_lease:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=rhsaas_demo_exchange:10m rate=10r/m;
limit_req_status 429;

server {
    listen 80;
    server_name api-demo-rh.taquiondev.com.br *.api-demo-rh.taquiondev.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name api-demo-rh.taquiondev.com.br *.api-demo-rh.taquiondev.com.br;

    ssl_certificate /etc/letsencrypt/live/api-demo-rh.taquiondev.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-demo-rh.taquiondev.com.br/privkey.pem;

    client_max_body_size 1m;

    location ~ /\.(?!well-known/) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location /static/ {
        alias /opt/rhsaas/staticfiles/;
        access_log off;
        expires 30d;
    }

    location = /api/auth/login/ {
        limit_req zone=rhsaas_demo_auth burst=5 nodelay;
        proxy_pass http://rhsaas_demo_gunicorn;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }

    location = /api/demo/lease/ {
        limit_req zone=rhsaas_demo_lease burst=2 nodelay;
        proxy_pass http://rhsaas_demo_gunicorn;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }

    location = /api/demo/exchange/ {
        limit_req zone=rhsaas_demo_exchange burst=3 nodelay;
        proxy_pass http://rhsaas_demo_gunicorn;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }

    location ~ ^/(api/backups|backups/.*/download|api/obrigacoes-financeiras/exportar/) {
        limit_req zone=rhsaas_demo_sensitive burst=3 nodelay;
        proxy_pass http://rhsaas_demo_gunicorn;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }

    location / {
        limit_req zone=rhsaas_demo_api burst=30 nodelay;
        proxy_pass http://rhsaas_demo_gunicorn;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }
}
